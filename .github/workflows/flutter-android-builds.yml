name: Flutter Android Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/flutter-android-builds.yml'
      - 'calc_note/**'
      - 'netmirror/**'
      - 'whatsapp_saver/**'
  pull_request:
    paths:
      - '.github/workflows/flutter-android-builds.yml'
      - 'calc_note/**'
      - 'netmirror/**'
      - 'whatsapp_saver/**'

jobs:
  build-android:
    name: Build ${{ matrix.app }} Android artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - calc_note
          - netmirror
          - whatsapp_saver

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure calc_note signing files
        if: matrix.app == 'calc_note'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.CALC_NOTE_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.CALC_NOTE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.CALC_NOTE_ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.CALC_NOTE_ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "Missing calc_note signing secrets." >&2
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build appbundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-aab
          path: ${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
